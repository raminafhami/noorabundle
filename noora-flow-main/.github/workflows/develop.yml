name: Deploy to My Server

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Install OpenVPN
        run: sudo apt install -y openvpn

      - name: Set up VPN Configuration
        run: |
          echo "${{ secrets.VPN_CONFIG }}" | base64 --decode > vpn-config.ovpn
          echo -e "${{ secrets.VPN_USERNAME }}\n${{ secrets.VPN_PASSWORD }}" > auth.txt

      - name: Connect to VPN
        run: openvpn --config vpn-config.ovpn --auth-user-pass auth.txt > /dev/null 2>&1 &

      - name: Wait for VPN connection
        run: |
          # Wait for the VPN connection to establish
          sleep 20  # Adjust this time if needed

      - name: Check Running VPN Processes
        run: ps aux | grep openvpn

      - name: Check Network Routing
        run: ip route

      - name: Verify VPN Connection
        run: curl ifconfig.me # Ensure IP has changed

      - name: SSH into server and deploy
        run: |
          ssh -T -o StrictHostKeyChecking=no root@192.168.2.26 "cd /root/apps/noora-flow && git checkout develop && git pull && docker compose -f docker-compose.dev.yml up -d --build && docker image prune -f"
